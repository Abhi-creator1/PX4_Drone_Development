[package]
name = "autonomous_drone_fsm"
version = "0.1.0"
edition = "2021"

[dependencies]
# ROS2 Rust bindings
rclrs = "0.4"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Time and math
chrono = { version = "0.4", features = ["serde"] }
nalgebra = "0.32"

# Error handling
anyhow = "1.0"

# Serialization for config and logging
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"

[[bin]]
name = "autonomous_drone_fsm"
path = "src/main.rs"